version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER?error}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?error}
      - POSTGRES_DB=${POSTGRES_DB?error}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    volumes:
      - redis_data:/var/lib/redis/data
    restart: unless-stopped

  auth-service:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    container_name: inventory-auth
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/auth_db
      - DB_USERNAME=${POSTGRES_USER?error}
      - DB_PASSWORD=${POSTGRES_PASSWORD?error}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: inventory-backend
    environment:
      - DB_HOST=postgres
      - SERVER_PORT=${SERVER_PORT?error}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS?error}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUTH_JWKS_URL=http://auth-service:8081/api/v1/auth/.well-known/jwks.json
    depends_on:
      - postgres
      - redis
      - auth-service
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: inventory-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - auth-service
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
