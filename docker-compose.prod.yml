services:
  postgres:
    image: postgres:15-alpine
    container_name: inventory-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - POSTGRES_USER=${POSTGRES_USER?error}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?error}
    volumes:
      - ./db-init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: inventory-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --requirepass ${REDIS_PASSWORD?error}
    volumes:
      - redis_data:/data
    restart: unless-stopped

  migrator:
    image: migrate/migrate:v4.17.0
    container_name: inventory-migrator
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - migrations
    volumes:
      - ./Backend/internal/database/migrations:/migrations:ro
    command: >
      -path=/migrations
      -database postgres://${POSTGRES_USER?error}:${POSTGRES_PASSWORD?error}@postgres:5432/inventory?sslmode=disable
      up
    restart: "no"

  auth-service:
    image: ghcr.io/chamikauluwatta/inventory-auth:${TAG}
    container_name: inventory-auth
    healthcheck:
      test: wget -q -O /dev/null http://localhost:8081/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/auth_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD?error}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD?error}
      - REFRESH_COOKIE_SECURE=true
      - INVENTORY_SERVICE_URL=http://backend:8080
      - JWT_PRIVATE_KEY_PATH=/run/secrets/jwt_private_key
      - SPRING_PROFILES_ACTIVE=prod
    volumes:
      - ./secrets/jwt_private_key.pem:/run/secrets/jwt_private_key:ro
    restart: unless-stopped

  backend:
    image: ghcr.io/chamikauluwatta/inventory-backend:${TAG}
    container_name: inventory-backend
    healthcheck:
      test: wget -q -O /dev/null http://localhost:8080/api/v1/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    environment:
      - DB_HOST=postgres://postgres:${POSTGRES_PASSWORD?error}@postgres:5432/inventory?sslmode=disable
      - SERVER_PORT=${SERVER_PORT?error}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD?error}
      - AUTH_JWKS_URL=http://auth-service:8081/api/v1/auth/.well-known/jwks.json
    restart: unless-stopped

  nginx:
    image: ghcr.io/chamikauluwatta/inventory-nginx:${TAG}
    container_name: inventory-nginx
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: curl -s -o /dev/null http://localhost || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./secrets/origin-cert.pem:/etc/nginx/certs/origin.pem:ro
      - ./secrets/origin-key.pem:/etc/nginx/certs/private.key:ro
    depends_on:
      auth-service:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
