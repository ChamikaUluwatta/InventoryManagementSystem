server:
  port: 8081
spring:
  application:
    name: auth-service
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 5
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
app:
  jwt:
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 2592000000
    rsa:
      private-key-path: ${JWT_PRIVATE_KEY_PATH:}
  auth:
    refresh-cookie-secure: ${REFRESH_COOKIE_SECURE:false}
  inventory:
    service-url: ${INVENTORY_SERVICE_URL}
