name: Push Images

on:
    push:
        tags:
            - "v*.*.*"

env:
    IMAGE_PREFIX: ""

jobs:
    deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4

            - name: Set image prefix
              env:
                OWNER: ${{ github.repository_owner }}
              run: echo "IMAGE_PREFIX=ghcr.io/${OWNER,,}/inventory" >> "$GITHUB_ENV"
              shell: bash

            - uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Metadata (auth)
              id: meta_auth
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_PREFIX }}-auth
                  tags: |
                      type=semver,pattern={{version}}
                      type=sha

            - name: Build and push (auth)
              uses: docker/build-push-action@v5
              with:
                  context: ./AuthService
                  file: ./AuthService/Dockerfile
                  target: production
                  push: true
                  tags: ${{ steps.meta_auth.outputs.tags }}
                  labels: ${{ steps.meta_auth.outputs.labels }}
                  cache-from: type=gha,scope=auth
                  cache-to: type=gha,mode=max,scope=auth

            - name: Metadata (backend)
              id: meta_backend
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_PREFIX }}-backend
                  tags: |
                      type=semver,pattern={{version}}
                      type=sha

            - name: Build and push (backend)
              uses: docker/build-push-action@v5
              with:
                  context: ./Backend
                  file: ./Backend/Dockerfile
                  target: production
                  push: true
                  tags: ${{ steps.meta_backend.outputs.tags }}
                  labels: ${{ steps.meta_backend.outputs.labels }}
                  cache-from: type=gha,scope=backend
                  cache-to: type=gha,mode=max,scope=backend

            - name: Metadata (frontend)
              id: meta_frontend
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_PREFIX }}-frontend
                  tags: |
                      type=semver,pattern={{version}}
                      type=sha

            - name: Build and push (frontend)
              uses: docker/build-push-action@v5
              with:
                  context: ./Frontend
                  file: ./Frontend/Dockerfile
                  push: true
                  tags: ${{ steps.meta_frontend.outputs.tags }}
                  labels: ${{ steps.meta_frontend.outputs.labels }}
                  cache-from: type=gha,scope=frontend
                  cache-to: type=gha,mode=max,scope=frontend

            - name: Metadata (nginx)
              id: meta_nginx
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_PREFIX }}-nginx
                  tags: |
                      type=semver,pattern={{version}}
                      type=sha

            - name: Build and push (nginx)
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./nginx/Dockerfile
                  build-args: |
                      NGINX_CONF=nginx/nginx.prod.conf
                  push: true
                  tags: ${{ steps.meta_nginx.outputs.tags }}
                  labels: ${{ steps.meta_nginx.outputs.labels }}
                  cache-from: type=gha,scope=nginx
                  cache-to: type=gha,mode=max,scope=nginx
