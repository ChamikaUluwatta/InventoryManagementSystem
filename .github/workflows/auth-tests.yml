name: Auth Service Tests

on:
  pull_request:
    paths:
      - 'authservice/**'
      - '.github/workflows/auth-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: authservice/pom.xml

      - name: Run tests
        run: ./mvnw test -Dtest='!com.inventory.auth.AuthServiceApplicationTests'
        working-directory: authService
